version: 2
updates:
  - package-ecosystem: pip
    directories:
      - /
      - /api
      - /council_crawler
      - /pipeline
      - /semantic_service
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        group-by: dependency-name

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
